<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07140f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Binder" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Open The Fertigation Binder to start owner signup or unlock the floor tablet." />
    <title>Log feed and runoff | The Fertigation Binder</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: #07140f;
        color: #e8f6ef;
      }
      body { font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif; }
      .boot-shell {
        min-height: 100%;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(12, 36, 28, 0.92), rgba(7, 20, 15, 0.98));
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.22);
      }
      .boot-main {
        flex: 1;
        padding: 42px 16px 24px;
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 16px;
      }
      .boot-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(34, 211, 238, 0.18);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }
      .boot-copy { margin: 0; color: #8aa396; font-size: 14px; }
      .boot-skel {
        width: 100%;
        min-height: 84px;
        border-radius: 16px;
        border: 1px solid rgba(34, 211, 238, 0.22);
        background: #10261c;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-main" role="status" aria-live="polite">
          <div class="boot-spinner" aria-hidden="true"></div>
          <p class="boot-copy">Loading binder…</p>
          <div class="boot-skel" aria-hidden="true"></div>
          <div class="boot-skel" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
